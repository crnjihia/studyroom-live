  <path d="M16 12C16 10.3431 17.3431 9 19 9H37L48 20V51C48 52.6569 46.6569 54 45 54H19C17.3431 54 16 52.6569 16 51V12Z" fill="url(#sheetGrad)" stroke="url(#primaryGrad)" stroke-width="2" />
  
  <!-- Folded Corner -->
  <path d="M37 9V17C37 18.6569 38.3431 20 40 20H48" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="1.8" />

  <!-- Text lines / Content Representation -->
  <line x1="22" y1="26" x2="33" y2="26" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" />
  <line x1="22" y1="33" x2="42" y2="33" stroke="#cbd5e1" stroke-width="2.2" stroke-linecap="round" />
  <line x1="22" y1="40" x2="38" y2="40" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" />

  <!-- Live Pulse Sync Indicator Ring & Dot -->
  <circle cx="46" cy="46" r="6" fill="#10b981" fill-opacity="0.25" filter="url(#glow)" />
  <circle cx="46" cy="46" r="4" fill="#10b981" />
  <circle cx="46" cy="46" r="2" fill="#ffffff" />
